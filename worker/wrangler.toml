# Cloudflare Worker for Overlap's API. Deploy with: npm run worker:deploy
# See docs/DEPLOY-CLOUDFLARE.md for the one-time setup.
name = "overlap-api"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Overlap doesn't log requests; keep Cloudflare's optional Worker logs off too.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "overlap"
database_id = "09cd7135-b235-4d42-9dcd-65409f359592"
migrations_dir = "migrations"

# Every 10 minutes: send due update emails (only if email is set up), and
# delete expired polls (only if RETENTION_DAYS > 0; "0" keeps polls until the
# organizer deletes them).
[triggers]
crons = ["*/10 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://overlap.runtian.uk"
PUBLIC_URL = "https://overlap.runtian.uk"
RETENTION_DAYS = "0"
D1_RESTORE_DAYS = "7"
API_URL = "https://overlap-api.micropeptide.workers.dev"
# Email stays off until both EMAIL_FROM is set here and the RESEND_API_KEY
# secret exists (npx wrangler secret put RESEND_API_KEY).
EMAIL_FROM = "Overlap <overlap@mail.runtian.uk>"
